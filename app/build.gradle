apply plugin: 'com.android.application'

android {
    namespace "com.xurxodev.moviesandroidkata"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.xurxodev.moviesandroidkata"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX (reemplaza com.android.support)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Mismas librerías, versiones actualizadas
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Dagger2
    implementation 'com.google.dagger:dagger-android:2.59.2'
    annotationProcessor 'com.google.dagger:dagger-android-processor:2.59.2'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.59.2'

    // Glide
    implementation 'com.github.bumptech.glide:glide:5.0.5'
}